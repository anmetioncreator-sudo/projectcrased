<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Authentication | dsadsaadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root {
  --bg-primary: #07090e;
  --bg-card: rgba(13, 18, 30, 0.85);
  --border-card: rgba(56, 189, 248, 0.15);
  --border-focus: #00f2fe;
  --accent-cyan: #00f2fe;
  --accent-blue: #4facfe;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --danger-bg: rgba(239, 68, 68, 0.12);
  --danger-border: rgba(239, 68, 68, 0.35);
  --danger-text: #f87171;
}
body {
  background: var(--bg-primary);
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.15) 0%, transparent 60%),
    radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.08) 0%, transparent 50%);
  color: var(--text-main);
  font-family: 'Inter', -apple-system, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
.login-wrapper {
  width: 100%;
  max-width: 400px;
}
.panel {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-card);
  border-radius: 16px;
  padding: 40px 32px;
  box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8), 0 0 30px -10px rgba(0, 242, 254, 0.15);
  position: relative;
  overflow: hidden;
}
.panel::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-blue), transparent);
}
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-bottom: 28px;
}
.logo-icon {
  width: 52px;
  height: 52px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(79, 172, 254, 0.25));
  border: 1px solid rgba(0, 242, 254, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
}
.logo-icon svg {
  width: 26px;
  height: 26px;
  fill: none;
  stroke: var(--accent-cyan);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
h1 {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #fff;
  margin-bottom: 6px;
}
.subtitle {
  font-size: 0.8rem;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 1px;
}
.badge-portal {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 20px;
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.25);
  color: #34d399;
  font-size: 0.72rem;
  font-family: 'JetBrains Mono', monospace;
  margin-top: 10px;
}
.badge-portal .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #34d399;
  box-shadow: 0 0 8px #34d399;
}
.err {
  background: var(--danger-bg);
  border: 1px solid var(--danger-border);
  color: var(--danger-text);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 0.82rem;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.input-group {
  margin-bottom: 20px;
  position: relative;
}
.input-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  color: #94a3b8;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
input[type=password], input[type=text] {
  width: 100%;
  padding: 12px 14px;
  padding-right: 42px;
  background: rgba(10, 14, 23, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.95rem;
  letter-spacing: 1px;
  outline: none;
  transition: all 0.2s ease;
}
input:focus {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.15);
  background: rgba(12, 17, 29, 0.95);
}
.toggle-btn {
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  cursor: pointer;
  color: #64748b;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px;
  transition: color 0.2s;
}
.toggle-btn:hover {
  color: var(--accent-cyan);
}
button[type=submit] {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
  border: none;
  color: #ffffff;
  font-family: 'Inter', sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0, 198, 255, 0.35);
  transition: all 0.25s ease;
}
button[type=submit]:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(0, 198, 255, 0.5);
  filter: brightness(1.1);
}
button[type=submit]:active {
  transform: translateY(0);
}
.footer-note {
  text-align: center;
  font-size: 0.72rem;
  color: #475569;
  margin-top: 24px;
  font-family: 'JetBrains Mono', monospace;
}
</style>
</head>
<body>
<div class="login-wrapper">
  <div class="panel">
    <div class="brand">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h1>DSADSA ADMIN</h1>
      <div class="subtitle">PROJECT CRASED SECURITY GATEWAY</div>
      <div class="badge-portal">
        <div class="dot"></div>
        SECURE ADMIN PORTAL
      </div>
    </div>

    {% if error %}
    <div class="err">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST">
      <div class="input-group">
        <label>8-Digit Admin Passcode</label>
        <div class="input-wrap">
          <input type="password" id="passInput" name="password" placeholder="••••••••" required autofocus autocomplete="current-password" pattern="[0-9]*" inputmode="numeric">
          <button type="button" class="toggle-btn" onclick="togglePass()" title="Toggle visibility">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit">AUTHENTICATE & ENTER</button>
    </form>

    <div class="footer-note">
      IP DEFENSE ACTIVE &bull; UNAUTHORIZED ATTEMPTS ARE BANNED
    </div>
  </div>
</div>

<script>
function togglePass() {
  const input = document.getElementById('passInput');
  const icon = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}
</script>
</body>
</html>
